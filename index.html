<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Detector Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        #refresh {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #refresh:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>Waste Detector</h1>
    <button id="refresh">🔄 Refresh Data</button>
    <p id="loading">Loading data...</p>

    <table id="wasteTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Device</th>
                <th>Timestamp</th>
                <th>Waste Level</th>
                <th>Processing Time</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <p id="errorMessage" class="error"></p>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
